[project]
name = "sidestage"
version = "0.1.0"
description = "Synthetic live-selling copilot prototype"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.6,<3",
]

[dependency-groups]
dev = [
  "playwright>=1.54,<2",
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidestage"]

[tool.pytest.ini_options]
addopts = '-ra -m "not live_model"'
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live_model: requires a configured external model provider",
]
