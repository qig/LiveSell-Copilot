services:
  - type: web
    name: livesell-copilot
    runtime: docker
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      name: sidestage-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SIDESTAGE_MODEL_PROVIDER
        value: openai
      - key: SIDESTAGE_MODEL_ID
        value: gpt-5.6-luna
      - key: SIDESTAGE_MODEL_REASONING_EFFORT
        value: none
      - key: SIDESTAGE_DEMO_USERNAME
        value: qiguo
      - key: SIDESTAGE_DEMO_PASSWORD
        sync: false
      - key: SIDESTAGE_DEMO_MAX_REQUESTS_PER_SESSION
        value: "20"
      - key: SIDESTAGE_DEMO_MAX_REQUESTS_PER_DAY
        value: "100"
      - key: SIDESTAGE_DATABASE_PATH
        value: /var/data/sidestage.sqlite3
